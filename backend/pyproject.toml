# SmartAgri core build file. Exact dependency versions: requirements.lock (Python 3.12), constraints-py39.txt.
[build-system]
requires = ["setuptools>=58"]
build-backend = "setuptools.build_meta"

[project]
name = "smartagri"
version = "0.1.0"
description = "Active, uncertainty-aware agronomic advisory: decision model, retrieval and evaluation harness (research prototype)"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
# Exact versions: requirements.lock (Python 3.12) and constraints-py39.txt (Python 3.9).
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "pydantic>=2"]
pg = ["psycopg[binary]>=3.1", "psycopg-pool>=3.2"]
embed = ["fastembed>=0.3"]
llm = ["anthropic"]
ingest = ["pypdf>=4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Research client: page, styles, scripts, icon and the vendored Leaflet with its licence.
"smartagri.research_api" = ["static/*.html", "static/*.css", "static/*.js", "static/*.svg", "static/vendor/leaflet/*.js",
                            "static/vendor/leaflet/*.css", "static/vendor/leaflet/LICENSE", "static/vendor/leaflet/images/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# Ablation ladder. Each rung adds exactly one layer of the experiment design (its Table 3); core code must never
# branch on a variant name. Layers per rung:
#   V0  language model with the static parcel profile (P, A, Q), no retrieval
#   V1  + hybrid retrieval (standard RAG; every retrieved passage is taken as applicable)
#   V2  + applicability pi over passage metadata, conditions read from the question only
#   V3  + dynamic parcel context: pi reads the parcel profile, and the weather summary W and the NDVI series S become
#         visible (`applicability: parcel_conditions` together with `dynamic_context: true`; without it W and S are
#         removed before deciding, see pipeline/run.py ablate_context)
#   V4  + the explicit sufficiency-and-asking model: input quality q, sufficiency sigma and question choice alpha
#         (defined as one layer by the design). Below V4 inputs carry no reliability grade ("ungraded").
#   V5  + decision policy delta and grounding check gamma (the full model)
# Variants without the sufficiency layer (V0-V3) leave the act to the text generator; with a language model they may
# also ask one free question per turn, which the evaluation runner maps to a prepared reply as for VC.
# Mode values are quoted: YAML 1.1 would otherwise read a bare `off` as the boolean false.
V0: {retrieval: "none",   applicability: "off",               dynamic_context: false, quality: false, sufficiency: false, asking: false, policy: false, grounding: false}
V1: {retrieval: "hybrid", applicability: "off",               dynamic_context: false, quality: false, sufficiency: false, asking: false, policy: false, grounding: false}
V2: {retrieval: "hybrid", applicability: "query_conditions",  dynamic_context: false, quality: false, sufficiency: false, asking: false, policy: false, grounding: false}
V3: {retrieval: "hybrid", applicability: "parcel_conditions", dynamic_context: true,  quality: false, sufficiency: false, asking: false, policy: false, grounding: false}
V4: {retrieval: "hybrid", applicability: "parcel_conditions", dynamic_context: true,  quality: true,  sufficiency: true,  asking: true,  policy: false, grounding: false}
V5: {retrieval: "hybrid", applicability: "parcel_conditions", dynamic_context: true,  quality: true,  sufficiency: true,  asking: true,  policy: true,  grounding: true}
# Context ablations for E4: V5 with one data source of the dynamic context removed before deciding.
# use_weather: false -> the weather summary W is empty; use_satellite: false -> the NDVI series S is empty.
V5-weather:   {retrieval: "hybrid", applicability: "parcel_conditions", dynamic_context: true, quality: true, sufficiency: true, asking: true, policy: true, grounding: true, use_weather: false}
V5-satellite: {retrieval: "hybrid", applicability: "parcel_conditions", dynamic_context: true, quality: true, sufficiency: true, asking: true, policy: true, grounding: true, use_satellite: false}
# Not a rung and not listed as an entry: VC ("LLM sa podacima i izvorima", E5) is the free AI conversation
# (pipeline/ai_chat.py) played over the same scenario context and the same applicable passages, with no
# decision model. evalkit runs it (`evalkit run --variant VC`, needs LLM_PROVIDER); core.decide never sees it.

# Machine-readable parameters of the analysis plan (docs/protocol.md). Read by `evalkit report`; locked with the
# protocol like every config/*.yaml file. A margin that is null has not been decided: the report then prints the
# interval and states "margin not set" instead of a decision. Nothing here may change after the protocol lock.
alpha: 0.05                 # two-sided; 95 % intervals. Proposed default, to be confirmed before the lock.
bootstrap: {samples: 10000, seed: 7}
kappa_bootstrap: {samples: 2000, seed: 7}
min_n_for_ci: 10            # no interval for a subset of fewer scenarios (strata are descriptive)
min_clusters: 5             # a cluster bootstrap over fewer clusters (parcels) is "not estimable": no interval is printed.
                            # Proposed default; the protocol owner confirms it before the lock (docs/protocol.md section 6).
scope:                      # what the first lock covers (analysis plan, section 4.4): V3, V4 and VC on the 40 scenarios
  variants: [V3, V4, VC]    # (plus the retrospective set). V0-V2 and V5 stay in the design and the code, not in the lock.
  include_e5: false         # E5 (V5 against VC, non-inferiority) is not in the first lock: no table, no verdict, no margin needed.
                            # Switch to true only for a later lock; the margin below must then be decided first.
primary:                    # E1: one primary outcome (docs/protocol.md section 2)
  comparison: [V4, V3]
  measure: k4_or_k5         # share of scenarios with at least one K4 or K5 error, per scenario, repeats averaged
  classes: [K4, K5]         # K1 cannot occur while rules.irrigation.quantity_validated is false; K2 and K3 do not depend on the layer
holm:                       # multiple comparisons: Holm over this family, after E1 (E1 is tested at the full alpha, outside it).
  test: wilcoxon_signed_rank  # supplementary p-value per member; intervals stay unadjusted and are described as such
  family:                   # key secondary outcomes of E1 (analysis plan, section 4.5.8, item 2). V4 - VC is not in the family: its status is open.
    - {name: E1-rubrika, comparison: [V4, V3], measure: total}
    - {name: E1-K1, comparison: [V4, V3], measure: K1}
    - {name: E1-K2, comparison: [V4, V3], measure: K2}
    - {name: E1-K3, comparison: [V4, V3], measure: K3}
    - {name: E1-prvi-cin, comparison: [V4, V3], measure: act_correct}
noninferiority:             # E5 (outside the first lock, see scope): rubric total of V5 not worse than VC by more than the margin
  comparison: [V5, VC]
  measure: total
  margin: null              # rubric points (0-10 scale). TO BE DECIDED BY THE PROTOCOL OWNER before the lock.
equivalence:                # negative control: V4 vs V3 on the stratum with complete, reliable inputs
  comparison: [V4, V3]
  measure: total
  strata: [complete]
  margin: null              # rubric points. TO BE DECIDED BY THE PROTOCOL OWNER before the lock.

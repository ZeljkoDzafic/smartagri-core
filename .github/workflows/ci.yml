# Continuous integration: lint, tests (SQLite, offline, no keys) on Python 3.9 and 3.12, the leakage guard on the
# development set, and a dependency audit of the pinned set. Dependencies are pinned by requirements.lock (3.12) and
# constraints-py39.txt (3.9).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  LLM_PROVIDER: template
  EMBEDDINGS_PROVIDER: none
  SMARTAGRI_OFFLINE: "1"

jobs:
  test:
    name: tests (Python ${{ matrix.python }})
    # Python 3.9 has no prebuilt build for Ubuntu 26.04 (actions/python-versions), so that leg stays on 24.04.
    runs-on: ${{ matrix.python == '3.9' && 'ubuntu-24.04' || 'ubuntu-26.04' }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/requirements.lock
            backend/constraints-py39.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.python }}" = "3.9" ]; then PIN=constraints-py39.txt; else PIN=requirements.lock; fi
          pip install -c "$PIN" -e ".[dev,api,ingest]"
      - name: Compile
        run: python -m compileall -q src
      - name: Lint (ruff, backend/ruff.toml)
        run: ruff check src tests
      - name: Test
        run: pytest -q
      - name: Leakage guard on the development set
        run: python -m smartagri.evalkit guard --set dev > /dev/null

  audit:
    name: dependency audit (pip-audit, requirements.lock)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pip-audit
      - run: pip-audit -r backend/requirements.lock --no-deps --disable-pip

  website:
    name: website check (links, anchors, screenshots)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check_presentation_site.py

  docker:
    name: container image (build and health check)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t smartagri-core .
      - name: Start and check
        run: |
          docker run -d --name smartagri -p 127.0.0.1:8100:8100 -e SMARTAGRI_OFFLINE=1 smartagri-core
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8100/api/health && break; sleep 2; done
          curl -fs http://127.0.0.1:8100/api/meta | python3 -c "import json, sys; assert json.load(sys.stdin)['accounts']['enabled']"
          docker logs smartagri
